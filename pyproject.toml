[project]
name = "veilgit"
version = "0.1.0"
description = "Transparent age+gzip encryption for git repositories via clean/smudge filters"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring git or external tools",
    "slow: long-running tests",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.8"
strict = true
files = ["veil_setup.py"]

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
